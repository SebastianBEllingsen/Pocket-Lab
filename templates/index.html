<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PocketLab - Blood Cell Image Editor</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

<header class="topbar">

<div class="logo">
    <span class="logo-icon">🔬</span>

    <div>
        <h1>PocketLab</h1>
        <p>Blood Cell Image Editor</p>
    </div>
</div>




</header>

<main class="app-container">


<!-- TOOLBAR -->

<section class="toolbar">

    <!-- FILE -->

    <div class="tool-group">

        <h3>File</h3>

        <!-- Hidden file input -->
        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >

        <button onclick="openImage()">
            📂 Open Image
        </button>

        <button onclick="sendAction('/save-image')">
            💾 Save
        </button>



    </div>


    <!-- TOOLS -->

    <div class="tool-group">

        <h3>Tools</h3>


        <button onclick="startCrop()">
            ✂ Crop
        </button>

        <button onclick="sendAction('/text')">
            T Text
        </button>

        <button onclick="sendAction('/contour')">
            ✎ Draw
        </button>

         <!-- Shapes dropdown -->

    <div class="dropdown">

        <button
            class="dropdown-button"
            onclick="toggleShapes()"
        >
            Shapes
            <span>▼</span>
        </button>

        <div
            id="shapesMenu"
            class="dropdown-menu"
        >

            <button onclick="sendAction('/arrow')">
                Arrow
            </button>

            <button onclick="sendAction('/circle')">
                Circle
            </button>

            <button onclick="sendAction('/rectangle')">
                Rectangle
            </button>

        </div>

    </div>

    </div>


    <!-- ZOOM -->

    <div class="tool-group">

        <h3>Zoom</h3>

        <button onclick="activateZoomIn()">
            🔍+
        </button>

        <button onclick="activateZoomIn()">
            🔍−
        </button>

    </div>



</section>


<!-- MAIN WORKSPACE -->

<section class="workspace">

    <!-- IMAGE EDITOR -->

    <div class="editor-panel">

        <div class="panel-header">

            <span>Image Editor</span>

            <span id="image-status">
                No image loaded
            </span>

        </div>


        <!-- IMAGE AREA -->

        <div class="canvas-container">

            <!-- Shown before an image is selected -->

            <div
                class="placeholder-image"
                id="imagePlaceholder"
            >

                <div class="microscope-icon">
                    🔬
                </div>

                <h2>
                    Open a microscope image
                </h2>

                <p>
                    Your blood-cell image will appear here.
                </p>



            </div>


            <!-- Selected image -->

             <div class="image-wrapper">

        <img
            id="editorImage"
            class="editor-image"
            alt="Selected microscope image"
            style="display: none;"
        >

        <div id="cropOverlay" class="crop-overlay">

            <div class="crop-handle top"></div>
            <div class="crop-handle bottom"></div>
            <div class="crop-handle left"></div>
            <div class="crop-handle right"></div>

        </div>

                 <div class="crop-actions">
                    <button id="applyCropButton" onclick="applyCrop()">
                        ✓ Apply Crop
                    </button>

                    <button id="cancelCropButton" onclick="cancelCrop()">
                        ✕ Cancel
                    </button>
                </div>

    </div>

        </div>


        <!-- BOTTOM TOOLBAR -->

<div class="bottom-toolbar">



    <span id="zoom-level">

    </span>

    <button onclick="sendAction('/undo')">
        ↶ Undo
    </button>

    <button onclick="sendAction('/redo')">
        ↷ Redo
    </button>

</div>

    </div>


    <!-- CELL ANALYSIS -->

    <aside class="analysis-panel">

        <div class="panel-header">
            Cell Analysis
        </div>


        <div class="analysis-content">

            <!-- COUNTING -->

            <h3>
                Counting
            </h3>

            <button
                class="analysis-button red-button"
                onclick="countCells('/count-red', 'red-count')"
            >
                🔴 Count Red Cells
            </button>

            <button
                class="analysis-button white-button"
                onclick="countCells('/count-white', 'white-count')"
            >
                ⚪ Count White Cells
            </button>


            <div class="count-card">

                <div>
                    <span>
                        Red Blood Cells
                    </span>

                    <strong id="red-count">
                        --
                    </strong>
                </div>

                <div>
                    <span>
                        White Blood Cells
                    </span>

                    <strong id="white-count">
                        --
                    </strong>
                </div>

            </div>


            <!-- CELL DISPLAY -->

            <h3>
                Cell Display
            </h3>

            <button
                class="analysis-button"
                onclick="sendAction('/show-red')"
            >
                🔴 Show Red Cells
            </button>

            <button
                class="analysis-button"
                onclick="sendAction('/show-white')"
            >
                ⚪ Show White Cells
            </button>

            <button
                class="analysis-button"
                onclick="sendAction('/show-all')"
            >
                🔬 Show All Cells
            </button>


            <!-- RESULTS -->

            <div class="result-box">

                <h3>
                    Analysis Results
                </h3>

                <p>
                    Image analysis results will appear here.
                </p>

            </div>

        </div>

    </aside>

</section>

</main>

<!-- MOBILE BOTTOM NAVIGATION -->

<nav class="mobile-nav">

    <button onclick="openImage()">
        📂
        <span>
            Open
        </span>
    </button>


    <button onclick="activateZoomIn()">
        🔍
        <span>
            Zoom
        </span>
    </button>


    <!-- Tools -->

    <div class="mobile-tools">

        <button onclick="toggleMobileTools()">
            🧷
            <span>
                Tools
            </span>
        </button>

       <!-- Tools list -->
        <div id="mobileToolsMenu" class="mobile-tools-menu">

            <button onclick="selectTool('crop')">
                ✂
                <span>Crop</span>
            </button>

            <button onclick="selectTool('draw')">
                ✎
                <span>Draw</span>
            </button>

            <button onclick="selectTool('text')">
                T
                <span>Text Box</span>
            </button>

            <button onclick="selectTool('arrow')">
                –→
                <span>Arrow</span>
            </button>

            <button onclick="selectTool('rectangle')">
                ▭
                <span>Rectangle</span>
            </button>

            <button onclick="selectTool('circle')">
                ◯
                <span>Circle</span>
            </button>

        </div>

    </div>

</nav>



<!-- NOTIFICATIONS -->

<div id="notification"></div>


<!-- JAVASCRIPT -->

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='photo_editor/image.js') }}"></script>
<script src="{{ url_for('static', filename='photo_editor/zoom.js') }}"></script>
<script src="{{ url_for('static', filename='photo_editor/crop.js') }}"></script>
</body>

</html>
